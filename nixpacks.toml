[phases.setup]
nixPkgs = ['python312']

[phases.install]
cmds = ['pip install --upgrade pip setuptools wheel', 'pip install -r requirements.txt']

[phases.build]
cmds = [
    'python manage.py collectstatic --noinput',
    'python manage.py copy_media_to_static'
]

[start]
cmd = 'python manage.py migrate && gunicorn ecommerce_project.wsgi:application --bind 0.0.0.0:$PORT'
